<header class="app-header">
  <a class="brand" routerLink="/" aria-label="Go to Todo home">
    <span aria-hidden="true">TA</span>
    <strong>Todo Angular</strong>
  </a>

  <nav class="nav" aria-label="Primary navigation">
    @for (item of navItems(); track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="item.exact ? { exact: true } : { exact: false }"
      >
        {{ item.label }}
      </a>
    }
  </nav>

  <div class="auth-actions">
    @if (currentUser(); as user) {
      <span class="user-name">Hi, {{ user.username }} · {{ user.role }}</span>
      <button class="auth-button" type="button" (click)="signOut()">Sign out</button>
    } @else {
      <a class="auth-button" routerLink="/sign-up" routerLinkActive="is-active">Sign up</a>
      <a
        class="auth-button auth-button--primary"
        routerLink="/sign-in"
        routerLinkActive="is-active"
      >
        Sign in
      </a>
    }
  </div>
</header>
